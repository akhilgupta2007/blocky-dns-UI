services:
  # 1. Blocky DNS Engine (Fast Go binary proxy & ad-blocker)
  blocky:
    image: ghcr.io/0xerr0r/blocky:latest
    container_name: blocky-engine
    user: "0:0"
    restart: unless-stopped
    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "4000:4000"
    environment:
      - TZ=UTC
      - BLOCKY_CONFIG_FILE=/app/config
    configs:
      - source: blocky_config
        target: /app/config/00_default.yml
    volumes:
      - ./data:/app/data
      - ./data:/app/config/dynamic
    networks:
      - blocky-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:4000/api/blocking/status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # 2. BlockyDNS Hub Dashboard & Secured HTTPS API
  hub:
    build: .
    image: ghcr.io/akhilgupta2007/blocky-dns-ui:latest
    container_name: blockydns-hub
    restart: unless-stopped
    ports:
      - "3000:3000"   # HTTP (Automatically redirects to HTTPS)
      - "3443:3443"   # End-to-End Encrypted HTTPS (TLS 1.3)
    environment:
      - INTEGRATION_MODE=all-in-one
      - BLOCKY_API_URL=http://blocky:4000
      - BLOCKY_CONFIG_PATH=/app/data/config.yml
      - DB_TYPE=sqlite
      - DATA_DIR=/app/data
      - CERTS_DIR=/app/certs
      - HTTP_PORT=3000
      - HTTPS_PORT=3443
      - ENABLE_HTTPS=true
      - JWT_SECRET=change_me_to_a_random_secure_secret_string
    volumes:
      - ./data:/app/data
      - ./certs:/app/certs
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      blocky:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -k -f https://127.0.0.1:3443/api/auth/status || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - blocky-net

configs:
  blocky_config:
    content: |
      upstreams:
        groups:
          default:
            - https://1.1.1.1/dns-query
            - tcp-tls:1.1.1.1:853
            - https://dns.quad9.net/dns-query
            - tcp-tls:9.9.9.9:853
        strategy: parallel_best
        timeout: 2s
      bootstrapDns:
        - 1.1.1.1
        - 8.8.8.8
      customDNS:
        customTTL: 1h
        mapping:
          router.lan: 192.168.1.1
      blocking:
        denylists:
          ads:
            - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
            - https://big.oisd.nl
            - https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/pro.txt
            - https://raw.githubusercontent.com/Perflyst/PiHoleBlocklist/master/SmartTV.txt
            - https://raw.githubusercontent.com/StevenBlack/hosts/master/alternates/porn/hosts
        clientGroupsBlock:
          default:
            - ads
        blockType: zeroIp
        loading:
          refreshPeriod: 4h
          strategy: fast
      queryLog:
        type: sqlite
        target: /app/data/blockydns.db
        logRetentionDays: 7
      ports:
        dns: 53
        http: 4000
      prometheus:
        enable: true
        path: /metrics

networks:
  blocky-net:
    driver: bridge
