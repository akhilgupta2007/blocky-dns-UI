<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#10b981" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Shield Shape -->
  <path d="M16 2.5 L27 6.5 C27 15.5 22.5 23.5 16 29.5 C9.5 23.5 5 15.5 5 6.5 Z" 
        fill="url(#shieldGrad)" 
        stroke="#ffffff" 
        stroke-width="1"
        stroke-opacity="0.2"
        filter="url(#glow)"/>
  <!-- Inner Security Checkmark / Monogram -->
  <path d="M11 16.5 L14.5 20 L21.5 13" 
        stroke="#ffffff" 
        stroke-width="2.8" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
